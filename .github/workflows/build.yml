name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    # Only pushes, manual runs, and same-repo PRs by the owner or the bot use the cache.
    env:
      TRUSTED: >-
        ${{ github.event_name != 'pull_request' || (
          github.event.pull_request.head.repo.full_name == github.repository && (
            github.event.pull_request.user.login == github.repository_owner ||
            github.event.pull_request.user.login == vars.FLAKE_BOT_LOGIN)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: willmb (macOS)
            runner: macos-latest
            attr: darwinConfigurations.willmb.system
          - name: willnixos (Linux)
            runner: ubuntu-24.04-arm
            attr: nixosConfigurations.willnixos.config.system.build.toplevel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: wra-bradshaw/cf-nix-cache@v0.9.0
        with:
          cache: will
          endpoint: ${{ env.TRUSTED == 'true' && secrets.CF_NIX_CACHE_ENDPOINT || '' }}
          public-key: ${{ secrets.CF_NIX_CACHE_PUBLIC_KEY }}
          pull-token: ${{ env.TRUSTED == 'true' && secrets.CF_NIX_CACHE_PULL_TOKEN || '' }}
          push-token: ${{ env.TRUSTED == 'true' && secrets.CF_NIX_CACHE_TOKEN || '' }}

      # Downloading a fully cached closure just to push nothing wastes GiBs.
      - name: Check for anything to build
        id: plan
        run: |
          log="$RUNNER_TEMP/dry-run.log"
          if ! nix build --dry-run ".#${{ matrix.attr }}" 2> "$log"; then
            cat "$log" >&2
            exit 1
          fi
          cat "$log"
          if grep -q 'will be built' "$log"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.name }}
        if: steps.plan.outputs.build == 'true'
        timeout-minutes: 210
        run: nix build --print-build-logs --out-link result ".#${{ matrix.attr }}"

      - uses: wra-bradshaw/cf-nix-cache/push@v0.9.0
        if: always()
