[project]
name = "dotfiles"
revision = "1.0"

[profiles.default]
CF_NIX_CACHE_TOKEN = { description = "cf-nix-cache admin token", required = true, ref = { item = "my-nix-cache admin credential", field = "credential" }, providers = ["op"] }
CF_NIX_CACHE_PULL_TOKEN = { description = "cf-nix-cache read-only token for the Nix daemon", required = true, ref = { item = "my-nix-cache pull credential", field = "credential" }, providers = ["op"] }
CF_NIX_CACHE_PUBLIC_KEY = { description = "cf-nix-cache Nix signing public key", required = true, ref = { item = "my-nix-cache admin credential", field = "public-key" }, providers = ["op"] }
CF_NIX_CACHE_ENDPOINT = { description = "cf-nix-cache Worker URL", required = true, ref = { item = "my-nix-cache admin credential", field = "hostname" }, providers = ["op"] }
